<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaloVision API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #163528 0%, transparent 55%), #090d16;
      color: #f3f4f6;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    .sub { margin: 0 0 22px; color: #9ca3af; font-size: 0.9rem; }
    label { display: block; font-size: 0.75rem; color: #86efac; margin-bottom: 8px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .row {
      display: flex; gap: 8px; align-items: stretch; margin-bottom: 14px;
    }
    input {
      flex: 1;
      border: 1px solid rgba(34,197,94,0.35);
      background: #0b1220;
      color: #e5e7eb;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-size: 0.95rem;
    }
    button, a.btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    button { background: #22c55e; color: #04140a; }
    button:hover { background: #4ade80; }
    .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    a.btn { background: rgba(255,255,255,0.06); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.1); }
    a.btn:hover { background: rgba(255,255,255,0.1); }
    #status { margin-top: 16px; font-size: 0.85rem; color: #9ca3af; }
    #status.ok { color: #4ade80; }
    #status.bad { color: #fb7185; }
    #toast { margin-top: 8px; font-size: 0.8rem; color: #86efac; min-height: 1.2em; }
  </style>
</head>
<body>
  <main class="card">
    <h1>CaloVision API</h1>
    <p class="sub">Base URL dùng cho app / Postman</p>

    <label>API Base URL</label>
    <div class="row">
      <input id="apiUrl" readonly>
      <button type="button" id="copyBtn">Copy</button>
    </div>

    <div class="links">
      <a class="btn" id="healthLink" href="/api/health" target="_blank">Health check</a>
      <a class="btn" href="/api-docs">Swagger</a>
      <a class="btn" href="/admin">Admin portal</a>
    </div>

    <p id="status">Đang kiểm tra server…</p>
    <p id="toast"></p>
  </main>

  <script>
    const base = window.location.origin;
    const apiUrl = base + '/api';
    document.getElementById('apiUrl').value = apiUrl;
    document.getElementById('healthLink').href = base + '/api/health';

    document.getElementById('copyBtn').onclick = async () => {
      try {
        await navigator.clipboard.writeText(apiUrl);
        document.getElementById('toast').textContent = 'Đã copy API URL';
      } catch {
        document.getElementById('apiUrl').select();
        document.getElementById('toast').textContent = 'Copy thủ công (Ctrl+C)';
      }
    };

    fetch(base + '/api/health')
      .then((r) => r.json())
      .then((d) => {
        const el = document.getElementById('status');
        el.className = 'ok';
        el.textContent = 'Online · ' + (d.app || 'OK') + ' · ' + (d.timestamp || '');
      })
      .catch(() => {
        const el = document.getElementById('status');
        el.className = 'bad';
        el.textContent = 'Không kết nối được /api/health';
      });
  </script>
</body>
</html>
